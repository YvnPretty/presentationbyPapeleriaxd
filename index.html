    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap');

        /* ===== VARIABLES DE TEMA ===== */
        :root {
            --bg-base:     #09090b;
            --bg-surface:  #18181b;
            --bg-card:     #27272a;
            --bg-header:   #18181b;
            --border:      #3f3f46;
            --text-main:   #ffffff;
            --text-muted:  #a1a1aa;
            --text-faint:  #52525b;
            --accent:      #10b981;
            --shadow:      rgba(0,0,0,0.5);
        }

        /* ===== TEMA CLARO ===== */
        body.light-theme {
            --bg-base:     #f0f4f8;
            --bg-surface:  #ffffff;
            --bg-card:     #e2e8f0;
            --bg-header:   #ffffff;
            --border:      #cbd5e1;
            --text-main:   #0f172a;
            --text-muted:  #334155;
            --text-faint:  #64748b;
            --accent:      #047857;
            --shadow:      rgba(15,23,42,0.10);
        }

        /* ===== BASE ===== */
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background-color: var(--bg-base);
            color: var(--text-main);
            transition: background 0.35s ease, color 0.35s ease;
        }

        .title-font { font-family: 'Playfair Display', sans-serif; }

        /* ===== HEADER / FOOTER ===== */
        header, footer {
            background-color: var(--bg-header) !important;
            border-color: var(--border) !important;
            transition: background 0.35s ease, border-color 0.35s ease;
        }
        body.light-theme footer,
        body.light-theme footer * { color: var(--text-muted) !important; }

        /* ===== TABS ===== */
        .nav-tab { transition: all 0.3s ease; color: var(--text-muted); }
        #tabs { background-color: var(--bg-surface) !important; transition: background 0.35s ease; }
        .nav-tab.active {
            border-bottom: 4px solid var(--accent);
            color: var(--accent);
            font-weight: 600;
        }
        .nav-tab:hover { background-color: var(--bg-card) !important; }

        /* ===== BOTONES HEADER ===== */
        #btn-prev, #btn-next-wrap, #btn-fullscreen, #btn-theme { transition: background 0.35s ease, color 0.35s ease; }
        #btn-prev { background-color: var(--bg-card) !important; color: var(--text-main) !important; }
        #btn-prev:hover { filter: brightness(0.9); }

        /* ===== SLIDE CONTAINER ===== */
        #slide-container { background-color: var(--bg-base); transition: background 0.35s ease; }

        /* ===== SPLIT SLIDE ===== */
        .split-slide { display: flex; gap: 2rem; height: 100%; }

        .content-side {
            flex: 1; background-color: var(--bg-surface);
            padding: 2rem; border-radius: 1rem;
            border-top: 6px solid var(--accent);
            transition: background 0.35s ease, border-color 0.35s ease;
        }

        .image-side {
            flex: 1; display: flex; align-items: center; justify-content: center;
            background-color: var(--bg-card); border-radius: 1rem; padding: 1rem;
            transition: background 0.35s ease;
        }

        .image-side img {
            max-height: 520px; max-width: 100%;
            border-radius: 12px; box-shadow: 0 10px 30px var(--shadow);
        }

        .content-area { max-height: calc(100vh - 200px); overflow-y: auto; scrollbar-width: thin; }

        /* ===== BOTON DE TEMA ===== */
        #btn-theme {
            width: 48px; height: 48px; display: flex; align-items: center;
            justify-content: center; background-color: var(--bg-card);
            border-radius: 1rem; font-size: 22px; cursor: pointer;
            border: 1px solid var(--border);
            transition: background 0.35s ease, border-color 0.35s ease, transform 0.2s;
        }
        #btn-theme:hover { transform: rotate(20deg) scale(1.1); }

        /* ================================================================
           TEMA CLARO - OVERRIDES COMPLETOS
        ================================================================ */

        /* Fondos */
        body.light-theme .bg-zinc-950 { background-color: var(--bg-base) !important; }
        body.light-theme .bg-zinc-900 { background-color: var(--bg-surface) !important; border: 1px solid var(--border) !important; }
        body.light-theme .bg-zinc-800 { background-color: var(--bg-card) !important; border: 1px solid var(--border) !important; }

        /* Texto - clases explicitas */
        body.light-theme .text-white    { color: var(--text-main)  !important; }
        body.light-theme .text-zinc-200 { color: var(--text-main)  !important; }
        body.light-theme .text-zinc-300 { color: var(--text-muted) !important; }
        body.light-theme .text-zinc-400 { color: var(--text-muted) !important; }
        body.light-theme .text-zinc-500 { color: var(--text-faint) !important; }
        body.light-theme .text-zinc-600 { color: var(--text-faint) !important; }

        /* Texto dentro de cards zinc sin clase explicita */
        body.light-theme .bg-zinc-900 h1, body.light-theme .bg-zinc-900 h2, body.light-theme .bg-zinc-900 h3,
        body.light-theme .bg-zinc-900 p, body.light-theme .bg-zinc-900 li, body.light-theme .bg-zinc-900 span,
        body.light-theme .bg-zinc-900 td, body.light-theme .bg-zinc-900 th { color: var(--text-main); }
        body.light-theme .bg-zinc-800 h1, body.light-theme .bg-zinc-800 h2, body.light-theme .bg-zinc-800 h3,
        body.light-theme .bg-zinc-800 p, body.light-theme .bg-zinc-800 li, body.light-theme .bg-zinc-800 span { color: var(--text-main); }

        /* strong siempre hereda */

        /* Acento emerald */
        body.light-theme .text-emerald-400,
        body.light-theme .text-emerald-300,
        body.light-theme .text-emerald-500 { color: var(--accent) !important; }

        /* Rojo */
        body.light-theme .text-red-400 { color: #b91c1c !important; }
        body.light-theme .text-red-300 { color: #991b1b !important; }

        /* Bordes */
        body.light-theme .border-zinc-700,
        body.light-theme .border-zinc-800 { border-color: var(--border) !important; }
        body.light-theme .border-emerald-500 { border-color: var(--accent) !important; }

        /* Tarjetas emerald bg */
        body.light-theme [class*="bg-emerald-9"] {
            background-color: #d1fae5 !important; border-color: #6ee7b7 !important;
        }
        body.light-theme [class*="bg-emerald-9"] h1, body.light-theme [class*="bg-emerald-9"] h2,
        body.light-theme [class*="bg-emerald-9"] h3, body.light-theme [class*="bg-emerald-9"] p,
        body.light-theme [class*="bg-emerald-9"] li, body.light-theme [class*="bg-emerald-9"] span { color: var(--text-main) !important; }
        body.light-theme [class*="bg-emerald-9"] .text-emerald-400,
        body.light-theme [class*="bg-emerald-9"] .text-emerald-300 { color: var(--accent) !important; }
        body.light-theme [class*="bg-emerald-9"] .text-zinc-400,
        body.light-theme [class*="bg-emerald-9"] .text-zinc-300 { color: var(--text-muted) !important; }
        body.light-theme [class*="border-emerald-6"] { border-color: var(--accent) !important; }

        /* Tarjetas rojo bg */
        body.light-theme [class*="bg-red-9"],
        body.light-theme [class*="bg-red-950"] { background-color: #fee2e2 !important; border-color: #fca5a5 !important; }
        body.light-theme [class*="bg-red-9"] h1, body.light-theme [class*="bg-red-9"] h2,
        body.light-theme [class*="bg-red-9"] h3, body.light-theme [class*="bg-red-9"] p,
        body.light-theme [class*="bg-red-9"] li,  body.light-theme [class*="bg-red-9"] span,
        body.light-theme [class*="bg-red-950"] h1, body.light-theme [class*="bg-red-950"] h2,
        body.light-theme [class*="bg-red-950"] p   { color: var(--text-main) !important; }
        body.light-theme [class*="bg-red-9"] .text-red-400,
        body.light-theme [class*="bg-red-950"] .text-red-400 { color: #b91c1c !important; }
        body.light-theme [class*="bg-red-9"] .text-red-300,
        body.light-theme [class*="bg-red-950"] .text-red-300 { color: #991b1b !important; }
        body.light-theme [class*="bg-red-9"] .text-zinc-300,
        body.light-theme [class*="bg-red-9"] .text-zinc-200 { color: var(--text-muted) !important; }
        body.light-theme [class*="border-red-5"] { border-color: #fca5a5 !important; }

        /* Pastillas numero metodologia */
        body.light-theme .bg-emerald-600 { background-color: var(--accent) !important; color: #fff !important; }
        body.light-theme .bg-emerald-500 { background-color: #059669 !important; color: #fff !important; }
        body.light-theme .bg-emerald-600 *,
        body.light-theme .bg-emerald-500 * { color: #fff !important; }

        /* Tabla */
        body.light-theme table thead tr,
        body.light-theme table tbody tr { border-color: var(--border) !important; }
        body.light-theme table td, body.light-theme table th { color: var(--text-main) !important; }

        /* Sombras */
        body.light-theme .shadow-lg { box-shadow: 0 4px 20px var(--shadow) !important; }

        /* ===== PANTALLA COMPLETA ===== */
        body.fullscreen-mode header,
        body.fullscreen-mode footer { display: none; }
        body.fullscreen-mode .flex-1 { padding: 2rem; display: flex; align-items: center; justify-content: center; }
        body.fullscreen-mode #slide-container { width: 100%; max-width: 100%; }
    </style>
</head>

        let currentIndex = 0;

        function renderTabs() {
            const container = document.getElementById('tabs');
            container.innerHTML = '';
            slidesData.forEach((slide, index) => {
                const btn = document.createElement('button');
                btn.className = `nav-tab px-5 py-3 text-sm rounded-3xl whitespace-nowrap ${index === currentIndex ? 'active bg-zinc-800' : 'hover:bg-zinc-800'}`;
                btn.textContent = slide.title;
                btn.onclick = () => goToSlide(index);
                container.appendChild(btn);
            });
        }

        function renderSlide() {
            const container = document.getElementById('slide-container');
            const slide = slidesData[currentIndex];

            container.innerHTML = `
                <div class="h-full flex flex-col">
                    <div class="mb-8">
                        <div class="inline-flex items-center gap-3 bg-zinc-900 px-8 py-4 rounded-3xl">
                            <span class="text-emerald-400 text-3xl">📌</span>
                            <h1 class="text-4xl title-font font-bold">${slide.title}</h1>
                        </div>
                    </div>
                    <div class="content-area flex-1">
                        ${slide.content}
                    </div>
                </div>
            `;

            document.getElementById('current-slide').textContent = currentIndex + 1;
        }

        function goToSlide(index) {
            if (index < 0 || index >= slidesData.length) return;
            currentIndex = index;
            renderTabs();
            renderSlide();
        }

        function nextSlide() {
            goToSlide(currentIndex + 1);
        }

        function prevSlide() {
            goToSlide(currentIndex - 1);
        }

        // --- Pantalla en negro (tecla B) ---
        let blackoutActive = false;
        const blackoutOverlay = document.createElement('div');
        blackoutOverlay.id = 'blackout-overlay';
        Object.assign(blackoutOverlay.style, {
            display: 'none', position: 'fixed', inset: '0',
            background: '#000', zIndex: '9999', cursor: 'pointer'
        });
        blackoutOverlay.onclick = () => toggleBlackout();
        document.body.appendChild(blackoutOverlay);

        function toggleBlackout() {
            blackoutActive = !blackoutActive;
            blackoutOverlay.style.display = blackoutActive ? 'block' : 'none';
        }

        // --- Detector de teclas del puntero (activa/desactiva con K) ---
        let keyDetectorOn = false;
        const keyDetector = document.createElement('div');
        keyDetector.id = 'key-detector';
        Object.assign(keyDetector.style, {
            display: 'none', position: 'fixed', bottom: '24px', right: '24px',
            background: 'rgba(16,185,129,0.95)', color: '#000', fontFamily: 'monospace',
            fontSize: '18px', fontWeight: 'bold', padding: '14px 24px',
            borderRadius: '14px', zIndex: '99999', boxShadow: '0 4px 24px rgba(0,0,0,0.5)',
            minWidth: '200px', textAlign: 'center'
        });
        keyDetector.innerHTML = 'Presiona un botón del puntero...';
        document.body.appendChild(keyDetector);

        function showKeyDetector(on) {
            keyDetectorOn = on;
            keyDetector.style.display = on ? 'block' : 'none';
            if (on) keyDetector.innerHTML = '📡 Presiona un botón del puntero...';
        }

        // Navegación con teclado y puntero/presenter (Leafgreen y otros)
        document.addEventListener('keydown', (e) => {

            // Mostrar detector con K
            if (e.key === 'k' || e.key === 'K') {
                showKeyDetector(!keyDetectorOn);
                return;
            }

            // Mostrar qué tecla llega (modo detector)
            if (keyDetectorOn) {
                keyDetector.innerHTML = `📡 Tecla detectada:<br><span style="font-size:22px">${e.key}</span><br><span style="font-size:12px;opacity:0.7">code: ${e.code} | keyCode: ${e.keyCode}</span>`;
            }

            // === SIGUIENTE DIAPOSITIVA ===
            // PageDown (Logitech, Leafgreen, etc.)
            // ArrowRight, Espacio (teclado)
            // Period (algunos presentadores baratos)
            // F5 (modo inicio PowerPoint en algunos punteros)
            if (['PageDown', 'ArrowRight', ' ', 'Period', '.'].includes(e.key)) {
                e.preventDefault();
                if (blackoutActive) { toggleBlackout(); return; }
                nextSlide();
                return;
            }

            // === DIAPOSITIVA ANTERIOR ===
            // PageUp (Logitech, Leafgreen, etc.)
            // ArrowLeft, Comma (algunos presentadores baratos)
            if (['PageUp', 'ArrowLeft', 'Comma', ','].includes(e.key)) {
                e.preventDefault();
                if (blackoutActive) { toggleBlackout(); return; }
                prevSlide();
                return;
            }

            // Pantalla completa (F o F5)
            if (e.key === 'f' || e.key === 'F' || e.key === 'F5') {
                e.preventDefault();
                toggleFullscreen();
                return;
            }

            // Pantalla negra (B = blackout)
            if (e.key === 'b' || e.key === 'B') {
                toggleBlackout();
                return;
            }

            // Tema claro/oscuro (T)
            if (e.key === 't' || e.key === 'T') {
                toggleTheme();
                return;
            }

            // Escape: sale del blackout
            if (e.key === 'Escape' && blackoutActive) {
                toggleBlackout();
            }
        });

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    alert(`Error al activar pantalla completa: ${err.message}`);
                });
                document.body.classList.add('fullscreen-mode');
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                    document.body.classList.remove('fullscreen-mode');
                }
            }
        }

        // ===== TOGGLE DE TEMA =====
        function toggleTheme() {
            const isLight = document.body.classList.toggle('light-theme');
            const btn = document.getElementById('btn-theme');
            btn.textContent = isLight ? '🌙' : '☀️';
            btn.title = isLight ? 'Cambiar a tema oscuro (T)' : 'Cambiar a tema claro (T)';
            localStorage.setItem('theme', isLight ? 'light' : 'dark');
        }

        // Detectar cambio de pantalla completa (por si se sale con ESC)
        document.addEventListener('fullscreenchange', () => {
            if (!document.fullscreenElement) {
                document.body.classList.remove('fullscreen-mode');
            }
        });

        // Inicialización
        window.onload = () => {
            document.getElementById('total-slides').textContent = slidesData.length;
            renderTabs();
            renderSlide();
            // Restaurar tema guardado
            if (localStorage.getItem('theme') === 'light') {
                document.body.classList.add('light-theme');
                const btn = document.getElementById('btn-theme');
                if (btn) { btn.textContent = '🌙'; btn.title = 'Cambiar a tema oscuro (T)'; }
            }
        };
    </script>
